# Local WordPress + WooCommerce to try the plugin. No PHP needed on your machine, only Docker.
#   docker compose run --rm composer install     # once (creates vendor/)
#   docker compose up -d                         # then open http://localhost:28080
#   docker compose run --rm composer test        # unit tests
# Host port 28080 is outside the Windows excluded port ranges (see README if it is taken).
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: '1'
    volumes:
      - anoofy-woo-db:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 3s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${ANOOFY_WP_PORT:-28080}:80'
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: '1'
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - anoofy-woo-wp:/var/www/html
      - ./:/var/www/html/wp-content/plugins/anoofy-woo

  composer:
    image: composer:2
    profiles: ['tools']
    working_dir: /app
    volumes:
      - ./:/app
    entrypoint: ['composer']

volumes:
  anoofy-woo-db:
  anoofy-woo-wp:
